<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>LecSync · 录音转写与 AI 纪要</title>
<meta name="theme-color" content="#0a0a0b" />
<link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22LecSync%22%2C%22short_name%22%3A%22LecSync%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230a0a0b%22%2C%22theme_color%22%3A%22%230a0a0b%22%2C%22icons%22%3A%5B%5D%7D" />

<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<style>
:root{
  --bg:#0a0a0b; --bg2:#111114; --card:#16161a; --line:#26262c; --line2:#33333b;
  --fg:#f2f2f4; --fg2:#9a9aa4; --fg3:#6b6b75;
  --accent:#e9e9ee; --accent-ink:#0a0a0b; --ok:#49d17d; --warn:#f0b93b; --bad:#f2555a;
  --r:14px; --r2:20px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--fg);text-decoration:none}
.boot{display:grid;place-items:center;height:100%;color:var(--fg2)}
#app{min-height:100%;display:flex;flex-direction:column;padding-bottom:calc(64px + var(--safe-b))}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:rgba(10,10,11,.86);backdrop-filter:saturate(140%) blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:.2px;flex:1;min-width:0}
.brand .dot{width:9px;height:9px;border-radius:3px;background:var(--accent);box-shadow:0 0 12px rgba(233,233,238,.5)}
#nav-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--fg2);font-size:18px}
.icon-btn:hover{background:var(--bg2);color:var(--fg)}
main{flex:1;padding:14px 14px 24px;max-width:920px;width:100%;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;padding:6px 8px calc(6px + var(--safe-b));background:rgba(10,10,11,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--fg3);padding:6px 14px;border-radius:12px;font-size:11px}
.tab span{font-size:17px;line-height:1}
.tab.active{color:var(--fg);background:var(--bg2)}
.tab em{font-style:normal}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card+.card{margin-top:10px}
.h1{font-size:22px;font-weight:650;letter-spacing:-.2px;margin:4px 0 10px}
.h2{font-size:15px;font-weight:600;margin:0 0 8px}
.muted{color:var(--fg2)}
.tiny{font-size:12px;color:var(--fg3)}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:12px;background:var(--bg2);border:1px solid var(--line2);color:var(--fg);font-weight:550;transition:.15s}
.btn:hover{background:#1c1c22}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(.94)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:#3a2226}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12px;color:var(--fg2)}
.input,textarea.input,select.input{width:100%;padding:11px 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line2);outline:none}
.input:focus{border-color:#5a5a66}
textarea.input{resize:vertical;min-height:84px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-size:12px;color:var(--fg2)}
.pill.ok{color:var(--ok);border-color:#1f3a2a}
.pill.warn{color:var(--warn);border-color:#3a3a22}
.session{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);margin-bottom:10px;transition:.15s}
.session:hover{border-color:var(--line2);transform:translateY(-1px)}
.session .meta{flex:1;min-width:0}
.session .t{font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.session .p{font-size:13px;color:var(--fg2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{padding:36px 16px;text-align:center;color:var(--fg3)}
.rec-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px 0 8px}
.rec-btn{width:112px;height:112px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:34px;box-shadow:0 0 0 8px rgba(233,233,238,.07);border:0}
.rec-btn.recording{background:var(--bad);color:#fff;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(242,85,90,.35)}70%{box-shadow:0 0 0 22px rgba(242,85,90,0)}100%{box-shadow:0 0 0 0 rgba(242,85,90,0)}}
.timer{font-variant-numeric:tabular-nums;font-size:34px;font-weight:300;letter-spacing:1px}
.wave{display:flex;gap:3px;align-items:center;height:34px}
.wave i{width:3px;border-radius:2px;background:var(--fg3);height:6px;transition:height .12s}
.live{width:100%;max-height:230px;overflow:auto;border-top:1px solid var(--line);padding-top:10px}
.live .ln{padding:5px 0;font-size:14px;border-bottom:1px dashed #1e1e24}
.live .ln .ts{color:var(--fg3);font-size:11px;margin-right:8px;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:10px;padding:8px 2px;border-bottom:1px solid #191920}
.seg .ts{flex:0 0 52px;color:var(--fg3);font-size:12px;font-variant-numeric:tabular-nums;padding-top:2px;cursor:pointer}
.seg .body{flex:1;min-width:0}
.seg .tr{color:var(--fg2);font-size:13px;margin-top:3px}
.seg.hi{background:#17171d;border-radius:8px}
.tabs{display:flex;gap:6px;margin:6px 0 12px;overflow:auto}
.tabs button{padding:7px 13px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);color:var(--fg2);font-size:13px;white-space:nowrap}
.tabs button.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chatbox{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:5px}
.msg.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.composer{position:sticky;bottom:calc(58px + var(--safe-b));display:flex;gap:8px;background:var(--bg);padding:8px 0}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:grid;align-items:end}
.sheet-card{background:var(--bg2);border-top:1px solid var(--line2);border-radius:18px 18px 0 0;padding:16px 16px calc(20px + var(--safe-b));max-height:86vh;overflow:auto;max-width:920px;width:100%;margin:0 auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--safe-b));z-index:80;background:#222228;border:1px solid var(--line2);padding:9px 16px;border-radius:999px;font-size:13px;max-width:88vw}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.list-item{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #191920}
.list-item:last-child{border-bottom:0}
.kbd{font-family:ui-monospace,Menlo,Consolas,monospace;background:#1c1c22;border:1px solid var(--line2);padding:1px 6px;border-radius:6px;font-size:12px}
.fade-in{animation:fi .18s ease-out}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

</style>
</head>
<body>
<div id="boot" class="boot">正在载入…</div>
<div id="app" hidden>
  <header class="topbar">
    <button class="icon-btn" id="btn-back" hidden aria-label="返回">‹</button>
    <div class="brand"><span class="dot"></span><span id="nav-title">LecSync</span></div>
    <div class="top-actions">
      <button class="icon-btn" id="btn-account" aria-label="账号">◍</button>
    </div>
  </header>

  <main id="view"></main>

  <nav class="tabbar" id="tabbar" hidden>
    <button data-tab="record" class="tab active"><span>●</span><em>录音</em></button>
    <button data-tab="sessions" class="tab"><span>≡</span><em>记录</em></button>
    <button data-tab="chat" class="tab"><span>✳</span><em>AI</em></button>
    <button data-tab="settings" class="tab"><span>⚙</span><em>设置</em></button>
  </nav>
</div>
<div id="sheet" class="sheet" hidden><div class="sheet-card" id="sheet-card"></div></div>
<div id="toast" class="toast" hidden></div>
<script type="module">

async function renderInlineShare() {
  const m = /#share=([^&]+)/.exec(location.hash || '');
  if (!m) return false;
  let d;
  try { d = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1]))))); } catch { return false; }
  document.getElementById('boot').hidden = true;
  const appEl = document.getElementById('app'); appEl.hidden = false;
  document.getElementById('nav-title').textContent = '分享';
  document.getElementById('tabbar').hidden = true;
  document.getElementById('btn-back').hidden = true;
  const dg = d.dg || {};
  document.getElementById('view').innerHTML = `
    <div class="card"><div class="h1" style="margin:0">${esc(d.t || '分享')}</div>
      <div class="tiny" style="margin-top:6px">${d.c ? new Date(d.c).toLocaleString('zh-CN') : ''} · ${fmtTime(d.d || 0)} · ${(d.g || []).length} 句</div></div>
    ${dg.summary ? `<div class="card"><div class="h2">摘要</div><p class="muted" style="margin:0">${esc(dg.summary)}</p></div>` : ''}
    <div class="card"><div class="h2">逐句转录</div>
      ${(d.g || []).map((g) => `<div class="seg"><div class="ts">${fmtTime(g.t0)}</div><div><div>${esc(g.text)}</div>${g.translation ? `<div class="tr">${esc(g.translation)}</div>` : ''}</div></div>`).join('')}
    </div>
    <p class="tiny" style="text-align:center">由 LecSync 分享 · 只读</p>`;
  return true;
}

// 本地模式适配层：后端不可达时，用 IndexedDB/localStorage 提供同等能力。
// 路径与后端 API 一一对应，前端逻辑不需要分支。
const LS = {
  db: 'lcs.local.db',
  sess: 'lcs.local.session',
};

const uid = (p = '') => p + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const now = () => new Date().toISOString();
const sha256 = async (s) => {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
};

function loadDb() {
  try { return JSON.parse(localStorage.getItem(LS.db) || '{}'); } catch { return {}; }
}
function saveDb(db) { localStorage.setItem(LS.db, JSON.stringify(db)); }
function dbInit() {
  const db = loadDb();
  db.users ||= []; db.sessions ||= []; db.folders ||= []; db.chats ||= []; db.shares ||= []; db.usage ||= [];
  return db;
}
let DB = dbInit();
const persist = () => saveDb(DB);
const currentUid = () => localStorage.getItem(LS.sess) || '';
const user = () => DB.users.find((u) => u.id === currentUid());

const fmt = (ms) => {
  const s = Math.max(0, Math.floor((ms || 0) / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return (h ? String(h).padStart(2, '0') + ':' : '') + String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
};

// ---- 本地纪要算法 ----
const STOP = new Set('的 了 和 是 在 我 有 就 不 人 都 一 一个 上 也 很 到 说 要 去 你 会 着 没有 看 好 自己 这 那 我们 他们 什么 这个 那个 因为 所以 但是 如果 然后 现在 可以 就是 还是 已经 这样 那样 时候 the a an and or but if then of in on at for with by to is are was were be it this that'.split(' '));
function tokens(text) {
  const out = [];
  for (const w of (String(text).match(/[\u4e00-\u9fff]{2,4}/g) || [])) if (!STOP.has(w)) out.push(w);
  for (const w of (String(text).toLowerCase().match(/[a-z][a-z'-]{2,}/g) || [])) if (!STOP.has(w)) out.push(w);
  return out;
}
function digestOf(segs) {
  const text = segs.map((s) => s.text).join(' ');
  const freq = new Map();
  for (const w of tokens(text)) freq.set(w, (freq.get(w) || 0) + 1);
  const kw = [...freq.entries()].sort((a, b) => b[1] - a[1]).slice(0, 12).map(([w]) => w);
  const sents = (text.match(/[^。！？!?.\n]+[。！？!?.]?/g) || []).map((s) => s.trim()).filter((s) => s.length > 1);
  const scored = sents.map((s, i) => {
    let sc = tokens(s).filter((t) => kw.includes(t)).length;
    if (/\d/.test(s)) sc += 0.4;
    return { s, i, sc };
  });
  const top = scored.sort((a, b) => b.sc - a.sc).slice(0, 5).sort((a, b) => a.i - b.i).map((x) => x.s.replace(/[。！？]$/, ''));
  const todos = sents.filter((s) => /(要|需要|应该|记得|安排|完成|跟进|确认|准备|下周|明天|todo|need to|should|follow|schedule)/i.test(s)).slice(0, 6);
  return {
    summary: top.join('；').slice(0, 400) || '（内容过短）',
    outline: top.map((s, i) => `${i + 1}. ${s.slice(0, 60)}`),
    points: top.slice(0, 5),
    todos: todos.map((t) => ({ text: t, done: false })),
    keywords: kw,
    generated_by: '本地规则（离线模式）',
    generated_at: now(),
  };
}

// ---- 本地导出 ----
const srtT = (ms) => {
  const t = Math.max(0, Math.round(ms || 0));
  return `${String(Math.floor(t / 3600000)).padStart(2, '0')}:${String(Math.floor((t % 3600000) / 60000)).padStart(2, '0')}:${String(Math.floor((t % 60000) / 1000)).padStart(2, '0')},${String(t % 1000).padStart(3, '0')}`;
};
function localExport(s, format = 'txt') {
  const segs = s.segments || [];
  const d = s.digest || {};
  if (format === 'srt') return segs.map((g, i) => `${i + 1}\n${srtT(g.t0)} --> ${srtT(g.t1 || (g.t0 || 0) + 3000)}\n${g.text}${g.translation ? '\n' + g.translation : ''}\n`).join('\n');
  if (format === 'vtt') return 'WEBVTT\n\n' + segs.map((g) => `${srtT(g.t0).replace(',', '.')} --> ${srtT(g.t1 || (g.t0 || 0) + 3000).replace(',', '.')}\n${g.text}${g.translation ? '\n' + g.translation : ''}\n`).join('\n');
  if (format === 'json') return JSON.stringify(s, null, 2);
  if (format === 'md') {
    const L = [`# ${s.title}`, '', `- 时间：${new Date(s.created_at).toLocaleString('zh-CN')}`, `- 时长：${fmt(s.duration_ms)}`, ''];
    if (d.summary) L.push('## 摘要', '', d.summary, '');
    if (d.points?.length) L.push('## 要点', '', ...d.points.map((p) => `- ${p}`), '');
    if (d.todos?.length) L.push('## 待办', '', ...d.todos.map((t) => `- [${t.done ? 'x' : ' '}] ${t.text}`), '');
    if (d.keywords?.length) L.push('## 关键词', '', d.keywords.map((k) => `\`${k}\``).join(' '), '');
    L.push('## 转录', '');
    for (const g of segs) L.push(`**${fmt(g.t0)}** ${g.text}`, g.translation ? `> ${g.translation}` : '', '');
    return L.join('\n');
  }
  return segs.map((g) => `[${fmt(g.t0)}] ${g.text}`).join('\n');
}

function localShareUrl(s) {
  const payload = { t: s.title, c: s.created_at, d: s.duration_ms, g: s.segments, dg: s.digest };
  const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
  return location.origin + location.pathname + '#share=' + b64;
}

// ---- 翻译（离线模式走 MyMemory，CORS 友好）----
async function translateLocal(text, target) {
  const pair = `zh-CN|${target || 'en'}`;
  const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(String(text).slice(0, 480))}&langpair=${encodeURIComponent(pair)}`;
  const r = await fetch(url);
  if (!r.ok) throw new Error('翻译服务不可达');
  const j = await r.json();
  const out = j?.responseData?.translatedText;
  if (!out) throw new Error('翻译失败');
  return out;
}

const notReady = (msg) => { const e = new Error(msg); e.status = 400; throw e; };

// ---- 主体：路由映射 ----
async function localApi(path, opts = {}) {
  DB = dbInit();
  const method = (opts.method || 'GET').toUpperCase();
  const body = typeof opts.body === 'string' ? JSON.parse(opts.body || '{}') : (opts.body || {});
  const [p, qs] = path.split('?');
  const q = new URLSearchParams(qs || '');

  if (p === '/api/health') return { ok: true, version: '1.0.0-local', mode: 'local', asr: false, llm: false };
  if (p === '/api/version') return { buildId: 'local', server: 'local' };

  // 认证
  if (p === '/api/auth/register') {
    const email = String(body.email || '').trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) notReady('邮箱格式不正确');
    if (String(body.password || '').length < 6) notReady('密码至少 6 位');
    if (DB.users.some((u) => u.email === email)) notReady('该邮箱已注册');
    const u = { id: uid('u_'), email, name: body.name || email.split('@')[0], hash: await sha256(body.password), created_at: now(), plan: 'pro', settings: {} };
    DB.users.push(u); persist(); localStorage.setItem(LS.sess, u.id);
    return { token: 'local', user: { ...u, hash: undefined } };
  }
  if (p === '/api/auth/mobile') {
    const email = String(body.email || '').trim().toLowerCase();
    const u = DB.users.find((x) => x.email === email);
    if (!u || u.hash !== await sha256(body.password || '')) notReady('邮箱或密码错误');
    localStorage.setItem(LS.sess, u.id);
    return { token: 'local', user: { ...u, hash: undefined } };
  }
  if (p === '/api/auth/refresh' || p === '/api/auth/logout') return { ok: true, token: 'local' };

  const me = user();
  const need = () => { if (!me) { const e = new Error('未登录'); e.status = 401; throw e; } };

  if (p === '/api/user/profile') { need(); return { user: { ...me, hash: undefined }, usage: localUsage() }; }
  if (p === '/api/user/settings') {
    need();
    if (method === 'PATCH') {
      me.settings = { ...(me.settings || {}) };
      for (const k of ['lang', 'target_lang', 'bilingual', 'asr_base', 'asr_model', 'llm_base', 'llm_model']) {
        if (body[k] !== undefined) me.settings[k] = body[k];
      }
      persist();
    }
    return { settings: me.settings || {}, caps: { asr: false, llm: false } };
  }
  if (p === '/api/usage/current') { need(); return { plan: 'pro', unlimited: true, ...localUsage() }; }

  // 会话
  if (p === '/api/sessions' && method === 'GET') {
    need();
    let list = DB.sessions.filter((s) => s.user_id === me.id && !s.deleted_at);
    const kw = (q.get('q') || '').toLowerCase();
    if (kw) list = list.filter((s) => s.title.toLowerCase().includes(kw) || s.segments.some((g) => g.text.toLowerCase().includes(kw)));
    list.sort((a, b) => (b.updated_at || '').localeCompare(a.updated_at || ''));
    return { items: list.map(brief), total: list.length };
  }
  if (p === '/api/sessions' && method === 'POST') {
    need();
    const s = { id: uid('s_'), user_id: me.id, title: body.title || '未命名录音', created_at: now(), updated_at: now(), duration_ms: body.duration_ms || 0, lang: body.lang || 'auto', target_lang: null, segments: [], digest: null, deleted_at: null, tags: [] };
    DB.sessions.push(s); persist();
    return { ...brief(s), segments: [], digest: null };
  }
  let m = p.match(/^\/api\/sessions\/([\w-]+)$/);
  if (m) {
    need();
    const s = DB.sessions.find((x) => x.id === m[1] && x.user_id === me.id);
    if (!s) notReady('会话不存在');
    if (method === 'GET') return s;
    if (method === 'PATCH') {
      Object.assign(s, { ...body, updated_at: now() });
      if (body.title !== undefined) s.title = String(body.title).slice(0, 120);
      persist(); return brief(s);
    }
    if (method === 'DELETE') { s.deleted_at = now(); persist(); return { ok: true }; }
  }
  m = p.match(/^\/api\/sessions\/([\w-]+)\/digest$/);
  if (m && method === 'POST') {
    need();
    const s = DB.sessions.find((x) => x.id === m[1] && x.user_id === me.id);
    if (!s) notReady('会话不存在');
    s.digest = digestOf(s.segments); s.updated_at = now(); persist();
    return s.digest;
  }
  m = p.match(/^\/api\/sessions\/([\w-]+)\/translate$/);
  if (m && method === 'POST') {
    need();
    const s = DB.sessions.find((x) => x.id === m[1] && x.user_id === me.id);
    if (!s) notReady('会话不存在');
    const target = body.target || 'en';
    let n = 0;
    for (const g of s.segments.slice(0, 60)) {
      if (g.translation) continue;
      try { g.translation = await translateLocal(g.text, target); n++; } catch { break; }
    }
    s.target_lang = target; persist();
    return { translated: n, segments: s.segments, target_lang: target };
  }

  // 回收站
  if (p === '/api/trash' && method === 'GET') { need(); return DB.sessions.filter((s) => s.user_id === me.id && s.deleted_at).map(brief); }
  if (p === '/api/trash/restore' && method === 'POST') {
    need();
    const s = DB.sessions.find((x) => x.id === body.id && x.user_id === me.id);
    if (!s) notReady('会话不存在');
    s.deleted_at = null; persist(); return brief(s);
  }

  // 逐句
  if (p === '/api/transcription/segments' && method === 'GET') {
    need();
    const s = DB.sessions.find((x) => x.id === q.get('sessionId') && x.user_id === me.id);
    if (!s) notReady('会话不存在');
    return { segments: s.segments, duration_ms: s.duration_ms };
  }
  if (p === '/api/transcription/segments' && method === 'POST') {
    need();
    const s = DB.sessions.find((x) => x.id === body.sessionId && x.user_id === me.id);
    if (!s) notReady('会话不存在');
    const segs = (Array.isArray(body.segments) ? body.segments : [body.segment || body])
      .filter((x) => x && String(x.text || '').trim())
      .map((x) => ({ id: uid('g_'), t0: Number(x.t0 || 0), t1: Number(x.t1 || 0), text: String(x.text).slice(0, 4000), translation: x.translation || null }));
    s.segments.push(...segs);
    s.duration_ms = Math.max(s.duration_ms || 0, ...s.segments.map((x) => x.t1 || 0), 0);
    s.updated_at = now(); persist();
    localBump(0);
    return { segments: segs, total: s.segments.length };
  }
  m = p.match(/^\/api\/transcription\/segments\/([\w-]+)$/);
  if (m) {
    need();
    const s = DB.sessions.find((x) => x.user_id === me.id && x.segments.some((g) => g.id === m[1]));
    if (!s) notReady('语句不存在');
    const g = s.segments.find((x) => x.id === m[1]);
    if (method === 'PATCH') { Object.assign(g, body); persist(); return g; }
    if (method === 'DELETE') { s.segments = s.segments.filter((x) => x.id !== m[1]); persist(); return { ok: true }; }
  }
  if (p === '/api/transcription/upload' && method === 'POST') {
    need();
    const s = { id: uid('s_'), user_id: me.id, title: body.get?.('title') || '上传录音', created_at: now(), updated_at: now(), duration_ms: Number(body.get?.('duration_ms') || 0), lang: 'auto', segments: [], digest: null, deleted_at: null };
    DB.sessions.push(s); persist();
    return { session: brief(s), segments: [], digest: null, asr: { ok: false, reason: '离线模式不支持服务端转写' } };
  }
  if (p === '/api/transcribe') return { ok: false, code: 'ASR_NOT_CONFIGURED', reason: '离线模式不支持服务端转写' };

  // 翻译
  if (p === '/api/translate' && method === 'POST') {
    const text = await translateLocal(body.text || '', body.target || 'en');
    return { text, target: body.target || 'en', engine: 'mymemory' };
  }

  // AI 对话（本地检索）
  if (p === '/api/chat/sessions') { need(); return DB.chats.filter((c) => c.user_id === me.id); }
  if (p === '/api/chat' && method === 'POST') {
    need();
    const question = String(body.message || '').trim();
    if (!question) notReady('消息为空');
    let convo = body.chatId ? DB.chats.find((c) => c.id === body.chatId) : null;
    if (!convo) { convo = { id: uid('c_'), user_id: me.id, session_id: body.sessionId || null, title: question.slice(0, 40), messages: [], created_at: now(), updated_at: now() }; DB.chats.push(convo); }
    convo.messages.push({ role: 'user', content: question, ts: now() });
    const s = body.sessionId ? DB.sessions.find((x) => x.id === body.sessionId) : null;
    let answer;
    if (s) {
      const q = tokens(question);
      const hits = s.segments.map((g) => ({ g, sc: q.filter((t) => g.text.includes(t)).length })).filter((x) => x.sc > 0).sort((a, b) => b.sc - a.sc).slice(0, 5);
      answer = hits.length ? '根据转录，相关原话：\n\n' + hits.map((x) => `[${fmt(x.g.t0)}] ${x.g.text}`).join('\n') : '转录里没有找到直接相关的内容。';
    } else {
      const all = DB.sessions.filter((x) => x.user_id === me.id);
      const q = tokens(question);
      const hits = [];
      for (const s2 of all) for (const g of s2.segments) { const sc = q.filter((t) => g.text.includes(t)).length; if (sc) hits.push({ s2, g, sc }); }
      hits.sort((a, b) => b.sc - a.sc);
      answer = hits.length ? '在你的记录里找到：\n\n' + hits.slice(0, 6).map((h) => `《${h.s2.title}》${fmt(h.g.t0)} ${h.g.text}`).join('\n') : '没有找到相关内容。';
    }
    const msg = { role: 'assistant', content: answer, ts: now() };
    convo.messages.push(msg); convo.updated_at = now(); persist();
    return { chat_id: convo.id, message: msg, engine: 'local-retrieval', messages: convo.messages };
  }
  m = p.match(/^\/api\/chat\/([\w-]+)$/);
  if (m && method === 'DELETE') { need(); DB.chats = DB.chats.filter((c) => c.id !== m[1] || c.user_id !== me.id); persist(); return { ok: true }; }

  // 分享（离线：内联数据链接）
  if (p === '/api/share/link' && method === 'POST') {
    need();
    const s = DB.sessions.find((x) => x.id === body.sessionId && x.user_id === me.id);
    if (!s) notReady('会话不存在');
    return { token: 'inline', url: localShareUrl(s), inline: true };
  }

  if (p === '/api/announcements/active') return [];
  if (p === '/api/keywords/extract') {
    const text = String(body.text || '');
    const freq = new Map();
    for (const w of tokens(text)) freq.set(w, (freq.get(w) || 0) + 1);
    return { keywords: [...freq.entries()].sort((a, b) => b[1] - a[1]).slice(0, 15).map(([word, count]) => ({ word, count })) };
  }

  const e = new Error('离线模式不支持该接口：' + p);
  e.status = 404;
  throw e;
}

function brief(s) {
  return {
    id: s.id, title: s.title, created_at: s.created_at, updated_at: s.updated_at, duration_ms: s.duration_ms || 0,
    lang: s.lang || 'auto', target_lang: s.target_lang || null, deleted_at: s.deleted_at || null,
    segment_count: (s.segments || []).length, has_digest: Boolean(s.digest),
    preview: (s.segments || []).map((x) => x.text).join(' ').slice(0, 120), tags: s.tags || [],
  };
}
function localUsage() {
  const uidNow = currentUid();
  const rows = DB.usage.filter((u) => u.user_id === uidNow);
  const day = new Date().toISOString().slice(0, 10);
  const month = day.slice(0, 7);
  return {
    today_seconds: rows.filter((r) => r.day === day).reduce((a, r) => a + r.seconds, 0),
    today_ai: rows.filter((r) => r.day === day).reduce((a, r) => a + r.ai, 0),
    month_seconds: rows.filter((r) => r.day.startsWith(month)).reduce((a, r) => a + r.seconds, 0),
    month_ai: rows.filter((r) => r.day.startsWith(month)).reduce((a, r) => a + r.ai, 0),
    total_seconds: rows.reduce((a, r) => a + r.seconds, 0),
    total_ai: rows.reduce((a, r) => a + r.ai, 0),
  };
}
function localBump(seconds = 0, ai = 0) {
  const id = currentUid(); if (!id) return;
  const day = new Date().toISOString().slice(0, 10);
  let row = DB.usage.find((u) => u.user_id === id && u.day === day);
  if (!row) { row = { user_id: id, day, seconds: 0, ai: 0 }; DB.usage.push(row); }
  row.seconds += seconds; row.ai += ai; persist();
}
function localIsLoggedIn() { return Boolean(currentUid() && user()); }
function localUser() { const u = user(); return u ? { ...u, hash: undefined } : null; }
function localPullSession(id) { DB = dbInit(); return DB.sessions.find((s) => s.id === id && s.user_id === currentUid()); }

const $ = (s, r = document) => r.querySelector(s);

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtTime = (ms) => {
  const s = Math.max(0, Math.floor((ms || 0) / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return (h ? String(h).padStart(2, '0') + ':' : '') + String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
};
const fmtDate = (iso) => {
  if (!iso) return '';
  const d = new Date(iso), n = new Date();
  const same = d.toDateString() === n.toDateString();
  return same ? d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })
    : d.toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit' });
};

const state = {
  token: localStorage.getItem('lcs.token') || '',
  user: null,
  caps: { asr: false, llm: false },
  tab: 'record',
  view: 'record',
  sessions: [],
  current: null,
  chat: null,
  recording: null,
  settings: {},
  usage: null,
  mode: 'remote', // remote | local（后端不可达时自动降级）
  apiBase: localStorage.getItem('lcs.api') || '',
};

async function remoteCall(path, opts = {}) {
  const headers = opts.headers || {};
  if (state.token) headers.authorization = 'Bearer ' + state.token;
  let body = opts.body;
  if (body && !(body instanceof FormData) && typeof body !== 'string') {
    headers['content-type'] = 'application/json';
    body = JSON.stringify(body);
  }
  const r = await fetch((state.apiBase || '') + path, { method: opts.method || 'GET', headers, body });
  const ct = r.headers.get('content-type') || '';
  const data = ct.includes('json') ? await r.json().catch(() => ({})) : await r.text();
  if (!r.ok) {
    const e = new Error((data && data.error) || `请求失败 ${r.status}`);
    e.status = r.status; e.data = data; throw e;
  }
  return data;
}

async function api(path, opts = {}) {
  if (state.mode === 'local') return localApi(path, opts);
  try {
    return await remoteCall(path, opts);
  } catch (e) {
    // 只有网络层失败才降级；4xx/5xx 属于业务错误，照常抛
    if (e.status) throw e;
    state.mode = 'local';
    try { toast('后端不可达，已切换到离线模式', 3000); } catch {}
    return localApi(path, opts);
  }
}

async function detectMode() {
  try {
    const ac = new AbortController();
    const t = setTimeout(() => ac.abort(), 3500);
    const r = await fetch((state.apiBase || '') + '/api/health', { signal: ac.signal });
    clearTimeout(t);
    if (!r.ok) throw new Error('bad');
    const j = await r.json();
    state.mode = j.mode === 'local' ? 'local' : 'remote';
  } catch { state.mode = 'local'; }
}

async function boot() {
  try {
    $('#boot').textContent = '正在连接…';
    await detectMode();
    if (state.mode === 'local') {
      $('#boot').hidden = true; $('#app').hidden = false;
      if (localIsLoggedIn()) {
        state.user = localUser();
        state.usage = null;
        return go('record');
      }
      return renderLogin();
    }
    if (state.token) {
      try {
        const p = await api('/api/user/profile');
        state.user = p.user; state.usage = p.usage;
        const s = await api('/api/user/settings');
        state.settings = s.settings || {}; state.caps = s.caps;
      } catch (e) {
        if (e.status === 401) { state.token = ''; localStorage.removeItem('lcs.token'); }
        else if (e.status) throw e;
      }
    }
    $('#boot').hidden = true; $('#app').hidden = false;
    if (!state.user) return renderLogin();
    go('record');
  } catch (e) {
    $('#boot').hidden = true; $('#app').hidden = false;
    $('#view').innerHTML = `<div class="card"><div class="h2">启动失败</div><p class="muted">${esc(e.message)}</p></div>`;
  }
}

function go(view, arg) {

  }).catch((e) => { box.innerHTML = `<div class="card"><div class="h2">出错了</div><p class="muted">${esc(e.message)}</p></div>`; });
}

async function toggleRecording() {
  if (rec) return stopRecording();
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true }, video: false });
    const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus'
      : MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : '';
    const recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
    const chunks = [];
    recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    recorder.start(1000);

    rec = { recorder, stream, chunks, t0: Date.now(), segs: [], marks: [], paused: false, timer: null, recognition: null, pending: [], flushing: false, transTimer: null };
    $('#rec-btn').classList.add('recording'); $('#rec-btn').textContent = '■';
    $('#btn-pause').hidden = false; $('#btn-mark').hidden = false;
    $('#live').hidden = false; $('#live').innerHTML = '';
    $('#rec-timer').textContent = '00:00';
    rec.timer = setInterval(() => {
      $('#rec-timer').textContent = fmtTime(Date.now() - rec.t0);
      const bars = $('#wave i');
      bars.forEach((b) => (b.style.height = 6 + Math.random() * 26 + 'px'));
    }, 260);
    rec.transTimer = setInterval(flushTranslations, 2500);

    startSpeech();
    toast('开始录音');
  } catch (e) {
    toast('无法录音：' + e.message);
  }
}

function startSpeech() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  try {
    const r = new SR();
    r.lang = state.settings.lang && state.settings.lang !== 'auto' ? state.settings.lang : 'zh-CN';
    r.continuous = true; r.interimResults = true; r.maxAlternatives = 1;
    let base = 0;
    r.onresult = (ev) => {
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const res = ev.results[i];
        const text = res[0].transcript.trim();
        if (!text) continue;
        if (res.isFinal) {
          const t0 = Date.now() - rec.t0;
          rec.segs.push({ t0: Math.max(0, t0 - text.length * 180), t1: t0, text });
          const idx = rec.segs.length - 1;
          appendLive(text, t0, idx);
          queueTranslate(text, idx);
        } else {
          showInterim(text);
        }
      }
    };
    r.onerror = (e) => { console.warn('speech error', e.error); if (e.error === 'not-allowed') toast('实时识别被拒绝，可改用上传音频'); };
    r.onend = () => { if (rec && !rec.paused) { try { r.start(); } catch {} } };
    r.start();
    rec.recognition = r;
  } catch (e) { console.warn(e); }
}

function appendLive(text, ms, idx) {
  const box = $('#live'); if (!box) return;
  const div = document.createElement('div');
  div.className = 'ln';
  div.dataset.idx = idx ?? '';
  div.innerHTML = `<span class="ts">${fmtTime(ms)}</span>${esc(text)}`;
  box.appendChild(div); box.scrollTop = box.scrollHeight;
}

// 实时同传：识别出整句后异步翻译，回填到对应行（原 App 的 Pro 功能，这里默认开）
function queueTranslate(text, idx) {
  if (!rec) return;
  if (state.settings.bilingual === false) return;
  if (!text || text.length < 2) return;
  rec.pending.push({ text, idx });
}

async function flushTranslations() {
  if (!rec || !rec.pending.length) return;
  if (!rec.flushing) {
    rec.flushing = true;
    const batch = rec.pending.splice(0, 3);
    for (const item of batch) {
      try {
        const r = await api('/api/translate', { method: 'POST', body: { text: item.text, target: state.settings.target_lang || 'en' } });
        const row = $(`#live .ln[data-idx="${item.idx}"]`);
        if (row && r.text) {
          let tr = row.querySelector('.tr');
          if (!tr) { tr = document.createElement('div'); tr.className = 'tr'; tr.style.cssText = 'color:var(--fg2);font-size:13px;margin-top:2px'; row.appendChild(tr); }
          tr.textContent = r.text;
        }
        if (rec) rec.segs[item.idx] && (rec.segs[item.idx].translation = r.text);
      } catch { /* 翻译失败不影响录音 */ }
    }
    rec.flushing = false;
  }
}
function showInterim(text) {
  const box = $('#live'); if (!box) return;
  let el = box.querySelector('.interim');
  if (!el) { el = document.createElement('div'); el.className = 'ln interim'; el.style.opacity = '.55'; box.appendChild(el); }
  el.textContent = text; box.scrollTop = box.scrollHeight;
}

function togglePause() {
  if (!rec) return;
  if (!rec.paused) {
    rec.recorder.pause(); rec.paused = true; $('#btn-pause').textContent = '继续';
    try { rec.recognition && rec.recognition.stop(); } catch {}
  } else {
    rec.recorder.resume(); rec.paused = false; $('#btn-pause').textContent = '暂停';
    startSpeech();
  }
}

async function stopRecording() {
  const r = rec; rec = null;
  clearInterval(r.timer);
  clearInterval(r.transTimer);
  try { r.recognition && r.recognition.stop(); } catch {}
  r.stream.getTracks().forEach((t) => t.stop());
  $('#rec-btn').classList.remove('recording'); $('#rec-btn').textContent = '●';
  $('#btn-pause').hidden = true; $('#btn-mark').hidden = true;
  const duration = Date.now() - r.t0;
  await new Promise((res) => { r.recorder.onstop = res; r.recorder.stop(); });
  const blob = new Blob(r.chunks, { type: r.recorder.mimeType || 'audio/webm' });
  const title = '录音 ' + new Date().toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
  toast('正在保存…', 1200);
  try {
    if (state.mode === 'remote' && state.caps.asr && blob.size > 2000) {
      const fd = new FormData();
      fd.append('file', blob, 'rec-' + Date.now() + (blob.type.includes('mp4') ? '.m4a' : '.webm'));
      fd.append('title', title);
      fd.append('duration_ms', String(duration));
      fd.append('lang', state.settings.lang || 'auto');
      const out = await api('/api/transcription/upload', { method: 'POST', body: fd });
      const s = out.session;
      if (!out.asr.ok && r.segs.length) {
        // 服务端转写失败时补写浏览器实时结果
        await api('/api/transcription/segments', { method: 'POST', body: { sessionId: s.id, segments: r.segs } }).catch(() => {});
      }
      toast(out.asr.ok ? '已转写并保存' : '已保存（' + (out.asr.reason || '转写未完成') + '）');
      return go('session', s.id);
    }
    const s = await api('/api/sessions', { method: 'POST', body: { title, duration_ms: duration, lang: state.settings.lang || 'auto' } });
    if (r.segs.length) {
      await api('/api/transcription/segments', { method: 'POST', body: { sessionId: s.id, segments: r.segs } });
    } else {
      toast('没有识别到文字：可上传音频到服务端转写，或手动编辑');
    }
    go('session', s.id);
  } catch (e) {
    toast('保存失败：' + e.message);
  }
}

async function onPickAudio(ev) {
  const f = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if (!f) return;
  if (state.mode === 'local') { toast('离线模式不支持音频转写：请用麦克风实时识别，或配置后端地址', 3600); return; }
  const fd = new FormData();

}

// 朗读（原 App 的 Pro 功能 TTS，这里用浏览器语音合成，免费无限）
function speakSession(s) {
  if (!('speechSynthesis' in window)) { toast('当前浏览器不支持朗读'); return; }
  const text = (s.segments || []).map((x) => x.text).join('。');
  if (!text) { toast('没有可朗读的内容'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = (state.settings.lang && state.settings.lang !== 'auto') ? state.settings.lang : 'zh-CN';
  u.rate = 1.0;
  speechSynthesis.speak(u);
  toast('开始朗读，再点一次可停止', 2400);
  const once = () => { speechSynthesis.cancel(); };
  setTimeout(() => {
    const btn = $('[data-tts]');
    if (btn) btn.onclick = once;
  }, 50);
}

document.addEventListener('click', async (e) => {
  if (e.target.id === 'chat-send') {
    const v = $('#chat-input').value.trim(); if (!v) return;
    const box = $('#chatbox');
    box.insertAdjacentHTML('beforeend', `<div class="msg user">${esc(v)}</div>`);
    $('#chat-input').value = '';
    const load = document.createElement('div'); load.className = 'msg bot'; load.innerHTML = '<span class="spin"></span>'; box.appendChild(load);
    try {
      const r = await api('/api/chat', { method: 'POST', body: { message: v, chatId: state.chat?.id } });
      state.chat = { id: r.chat_id, messages: r.messages };
      load.textContent = r.message.content;
      if (r.engine) load.insertAdjacentHTML('beforeend', `<div class="tiny" style="margin-top:6px">${esc(r.engine)}</div>`);
    } catch (err) { load.textContent = '失败：' + err.message; }
    box.scrollIntoView({ block: 'end' });
  }
  if (e.target.id === 'chat-del' && state.chat) {
    await api('/api/chat/' + state.chat.id, { method: 'DELETE' });
    toast('已删除'); go('chat');
  }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'chat-pick') {
    const id = e.target.value;
    if (!id) { state.chat = null; $('#chatbox').innerHTML = ''; return; }
    api('/api/chat/sessions').then((list) => {
      const c = list.find((x) => x.id === id);
      state.chat = c; paintChat(c);
    });
  }
});
function paintChat(c) {
  const box = $('#chatbox');
  box.innerHTML = (c.messages || []).map((m) => `<div class="msg ${m.role === 'user' ? 'user' : 'bot'}">${esc(m.content)}</div>`).join('') || '<div class="msg bot">开始一段新对话。</div>';
}

// ---------------- 设置页 ----------------

      <div class="list-item"><div>⇄ 同声传译 · 实时双语字幕</div><div class="pill ok">默认开启</div></div>
      <div class="list-item"><div>⤓ 导出 TXT / SRT / VTT / MD</div><div class="pill ok">全开（原 Pro）</div></div>

      <div class="list-item"><div>🔊 朗读（TTS）</div><div class="pill ok">无限（原 Pro）</div></div>
      <div class="list-item"><div>⇪ 分享链接 / 团队查看</div><div class="pill ok">全开（原 Pro）</div></div>
      <div class="list-item"><div>⛁ 离线使用</div><div class="pill ok">支持（原 Pro）</div></div>
      <div class="row between" style="margin-top:12px">
        <div class="tiny">录音时实时翻译成双语字幕</div>
        <label class="row" style="gap:6px"><input type="checkbox" id="bilingual" ${st.bilingual === false ? '' : 'checked'} /></label>
      </div>
      <p class="tiny" style="margin-top:8px">没有任何订阅、配额、内购或兑换码环节：这些能力在本版本里都是直接可用的开关。</p>
    </div>
    <div class="card">
      <div class="h2">语音识别（服务端转写）</div>
      <p class="tiny" style="margin-top:-4px">填 Whisper 兼容接口即可让上传/录音自动转写；留空则用浏览器实时识别。</p>
      <div class="grid2">
        <div class="field"><label>接口地址</label><input class="input" id="asr_base" placeholder="https://api.openai.com/v1" value="${esc(st.asr_base || '')}" /></div>
        <div class="field"><label>模型</label><input class="input" id="asr_model" placeholder="whisper-1" value="${esc(st.asr_model || '')}" /></div>
      </div>
      <div class="field"><label>API Key</label><input class="input" id="asr_key" type="password" placeholder="${st.asr_key_set ? '已设置（留空不变）' : 'sk-…'}" /></div>
      <button class="btn" id="save-asr">保存转写配置</button>
    </div>
    <div class="card">
      <div class="h2">大模型（纪要 / 问答 / 翻译增强）</div>
      <div class="grid2">
        <div class="field"><label>接口地址</label><input class="input" id="llm_base" placeholder="https://api.deepseek.com/v1" value="${esc(st.llm_base || '')}" /></div>
        <div class="field"><label>模型</label><input class="input" id="llm_model" placeholder="deepseek-chat" value="${esc(st.llm_model || '')}" /></div>
      </div>
      <div class="field"><label>API Key</label><input class="input" id="llm_key" type="password" placeholder="${st.llm_key_set ? '已设置（留空不变）' : 'sk-…'}" /></div>
      <button class="btn" id="save-llm">保存大模型配置</button>
    </div>
    <div class="card">
      <div class="h2">语言</div>
      <div class="grid2">
        <div class="field"><label>识别语言</label>
          <select class="input" id="lang">
            ${[['auto', '自动'], ['zh-CN', '中文'], ['en-US', 'English'], ['ja-JP', '日本語'], ['ko-KR', '한국어'], ['fr-FR', 'Français'], ['de-DE', 'Deutsch'], ['es-ES', 'Español']].map(([v, t]) => `<option value="${v}" ${st.lang === v ? 'selected' : ''}>${t}</option>`).join('')}
          </select></div>
        <div class="field"><label>翻译目标语言</label>
          <select class="input" id="target_lang">
            ${[['zh-CN', '中文'], ['en', 'English'], ['ja', '日本語'], ['ko', '한국어'], ['fr', 'Français'], ['de', 'Deutsch'], ['es', 'Español'], ['ru', 'Русский'], ['ar', 'العربية']].map(([v, t]) => `<option value="${v}" ${st.target_lang === v ? 'selected' : ''}>${t}</option>`).join('')}

      <button class="btn" id="save-lang">保存语言</button>
    </div>
    <div class="card">
      <div class="h2">运行模式</div>
      <div class="list-item"><div>当前模式</div><div class="pill ${state.mode === 'remote' ? 'ok' : 'warn'}">${state.mode === 'remote' ? '在线（服务端）' : '离线（本机存储）'}</div></div>
      <div class="field" style="margin-top:10px"><label>后端地址（留空=同源；离线可不管）</label><input class="input" id="api-base" placeholder="https://your-server.example.com" value="${esc(state.apiBase)}" /></div>

    <div class="card">
      <div class="h2">账号</div>
      <div class="row" style="gap:8px"><button class="btn" id="btn-logout">退出登录</button></div>
      <p class="tiny" style="margin-top:10px">版本 1.0.0 · 服务端转写 ${state.caps.asr ? '已就绪' : '未配置'} · 大模型 ${state.caps.llm ? '已就绪' : '未配置'}</p>
    </div>`;
}

document.addEventListener('click', async (e) => {
  if (e.target.id === 'save-asr' || e.target.id === 'save-llm') {
    const keys = e.target.id === 'save-asr' ? ['asr_base', 'asr_key', 'asr_model'] : ['llm_base', 'llm_key', 'llm_model'];
    const body = {};
    keys.forEach((k) => { const v = $('#' + k).value.trim(); if (v) body[k] = v; });
    try {
      const r = await api('/api/user/settings', { method: 'PATCH', body });
      state.settings = r.settings; state.caps = r.caps;
      toast('已保存'); go('settings');
    } catch (err) { toast('保存失败：' + err.message); }
  }
  if (e.target.id === 'save-lang') {
    const body = { lang: $('#lang').value, target_lang: $('#target_lang').value };
    const r = await api('/api/user/settings', { method: 'PATCH', body });
    state.settings = r.settings; toast('已保存');
  }
  if (e.target.id === 'bilingual') {
    const body = { bilingual: e.target.checked };
    try { const r = await api('/api/user/settings', { method: 'PATCH', body }); state.settings = r.settings; } catch {}
    toast(e.target.checked ? '已开启实时双语' : '已关闭实时双语');
  }
  if (e.target.id === 'save-api') {
    const v = $('#api-base').value.trim().replace(/\/+$/, '');
    state.apiBase = v;
    localStorage.setItem('lcs.api', v);
    await detectMode();
    toast('已切换到' + (state.mode === 'remote' ? '在线模式' : '离线模式'));
    go('settings');
  }
  if (e.target.id === 'btn-logout') {
    state.token = ''; state.user = null;
    localStorage.removeItem('lcs.token');
    localStorage.removeItem('lcs.local.session');
    go('login');
  }
});

</script>
</body>
</html>
