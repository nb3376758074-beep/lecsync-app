<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>渲染自检</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff;color:#111;
       font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .box{max-width:520px;padding:28px 22px;text-align:center}
  .ok{font-size:30px;font-weight:700;letter-spacing:-.5px}
  .sub{color:#555;margin-top:10px}
  .row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee;font-size:14px}
  .row b{color:#111}
  .yes{color:#0a7d33;font-weight:600}
  .no{color:#c0392b;font-weight:600}
  .mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#666;word-break:break-all}
</style>
</head>
<body>
<div class="box">
  <div class="ok" id="head">✅ 页面能正常渲染</div>
  <p class="sub">看到这行大字 + 白底黑字 + 边框线条，说明这个地址返回的是正常网页。</p>
  <div id="rows"></div>
  <p class="mono" id="ua"></p>
  <p class="sub" style="margin-top:18px">
    如果这里显示的是一堆 <code>&lt;div&gt;</code> 代码，说明地址给的是纯文本，换地址。<br>
    如果一直是空白，说明这个域名被你的网络拦了。
  </p>
  <p style="margin-top:20px"><a href="./" style="color:#0a7d33;font-size:15px">→ 打开应用</a></p>
</div>
<script>
  var rows = document.getElementById('rows');
  function row(k, v, ok) {
    var d = document.createElement('div');
    d.className = 'row';
    d.innerHTML = '<span>' + k + '</span><b class="' + (ok ? 'yes' : 'no') + '">' + v + '</b>';
    rows.appendChild(d);
  }
  row('JavaScript', '已执行', true);
  row('CSS 内联', getComputedStyle(document.body).backgroundColor === 'rgb(255, 255, 255)' ? '生效' : '异常', getComputedStyle(document.body).backgroundColor === 'rgb(255, 255, 255)');
  row('屏幕宽度', window.innerWidth + 'px', true);
  row('安全上下文', window.isSecureContext ? 'HTTPS' : '非 HTTPS', window.isSecureContext);
  row('媒体录制', !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) ? '支持' : '不支持', !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia));
  row('语音识别', (window.SpeechRecognition || window.webkitSpeechRecognition) ? '支持' : '不支持（改用服务端转写）', !!(window.SpeechRecognition || window.webkitSpeechRecognition));
  row('本地存储', (function () { try { localStorage.setItem('t', '1'); localStorage.removeItem('t'); return true; } catch (e) { return false; } })() ? '可用' : '被禁用', true);
  document.getElementById('ua').textContent = navigator.userAgent;
</script>
</body>
</html>
